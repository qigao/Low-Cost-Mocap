name: Algorithm API tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - algorithm/geometry-first
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: algorithm-api-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Python ${{ matrix.python-version }} unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    defaults:
      run:
        working-directory: computer_code/api

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # The observer host is a strictly optional Socket.IO service
          # which requires no camera SDK, serial port or flight controller.
          python -m pip install numpy scipy Flask Flask-SocketIO

      - name: Check installed dependencies
        run: python -m pip check

      - name: Run API unit tests
        run: python -m unittest discover -s tests -v

  observer-ui:
    name: Read-only observer UI build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: computer_code

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: computer_code/yarn.lock

      - name: Install locked frontend dependencies
        run: |
          corepack enable
          yarn install --frozen-lockfile --non-interactive --ignore-scripts

      - name: Build both existing UI and isolated read-only PoseStream page
        run: yarn build

      - name: Verify read-only viewer build output
        run: test -f dist/pose-monitor.html
